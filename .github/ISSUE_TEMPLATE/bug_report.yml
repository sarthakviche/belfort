name: Bug report
description: Something is wrong or broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Belfort version and operating system
      placeholder: e.g. 0.1.0 on Windows 11
