name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pandas numpy yfinance httpx pytest
      - name: Test (no network: every data source is replaced by synthetic data)
        run: python -m pytest -q
